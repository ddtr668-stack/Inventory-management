<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>(주)삼성이엔지 물류관리 · 로그인</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
           background: #f4f5f7; color: #111827; font-family: 'Inter', 'Noto Sans KR', 'Malgun Gothic', sans-serif; }
    .card { width: 100%; max-width: 380px; background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; padding: 28px 26px; box-shadow: 0 10px 30px rgba(15,23,42,.06); }
    .brand { margin-bottom: 22px; }
    .brand-name { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
    .brand-sub { font-size: 13px; color: #6b7280; margin-top: 4px; padding-top: 8px; border-top: 1px solid #e5e7eb; }
    label { display: block; font-size: 12.5px; font-weight: 600; color: #374151; margin-bottom: 5px; }
    .field { margin-bottom: 12px; }
    input[type=text], input[type=password] { width: 100%; padding: 10px 12px; font-size: 14px; border: 1px solid #d1d5db; border-radius: 8px; outline: none; background: #fff; }
    input:focus { border-color: #1f5ca8; box-shadow: 0 0 0 3px rgba(31,92,168,.15); }
    .btn { width: 100%; margin-top: 8px; padding: 11px; font-size: 14px; font-weight: 700; color: #fff; background: #1f5ca8; border: 0; border-radius: 8px; cursor: pointer; }
    .btn:hover { background: #1a4f91; }
    .btn:disabled { background: #9ca3af; cursor: default; }
    .msg { margin-top: 14px; padding: 10px 12px; border-radius: 8px; font-size: 12.5px; white-space: pre-wrap; }
    .err { background: #fef2f2; color: #b91c1c; }
    .foot { margin-top: 16px; text-align: center; font-size: 12px; color: #6b7280; line-height: 1.5; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <form id="form" class="card" autocomplete="on">
    <div class="brand">
      <div class="brand-name">(주)삼성이엔지</div>
      <div class="brand-sub">물류관리 · 로그인</div>
    </div>
    <div class="field"><label for="id">아이디</label><input id="id" type="text" autocomplete="username" autocapitalize="off" /></div>
    <div class="field"><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" /></div>
    <button id="submit" type="submit" class="btn">로그인</button>
    <div id="error" class="msg err hidden"></div>
    <div class="foot">조회 전용 페이지입니다.<br />계정은 관리자에게 받아 주세요.</div>
  </form>

  <script>
  (function () {
    // 재고 자료(data/app.enc)는 AES-GCM 으로 잠겨 있고, 아이디·비밀번호가 맞아야만 풀립니다.
    // 비밀번호는 어디에도 저장하지 않습니다. 이 탭을 닫으면 다시 로그인해야 합니다.
    const $ = id => document.getElementById(id);
    const enc = new TextEncoder();
    const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
    const toB64 = u => btoa(String.fromCharCode.apply(null, u));
    const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
    let busy = false;

    function setErr(t) { $('error').textContent = t || ''; $('error').classList.toggle('hidden', !t); }
    function setBusy(on, label) { busy = on; $('submit').disabled = on; $('submit').textContent = on ? (label || '확인 중…') : '로그인'; }

    async function getJson(url) {
      const r = await fetch(url + '?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) throw new Error('자료 파일을 찾지 못했습니다 (' + url + ')');
      return r.json();
    }

    async function unwrapKey(id, password) {
      const keys = await getJson('data/keys.json');
      const idHash = hex(await crypto.subtle.digest('SHA-256', enc.encode('sg-inv:' + id.trim().toLowerCase())));
      const u = (keys.users || {})[idHash];
      if (!u) return null;
      const base = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
      const kek = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(u.salt), iterations: u.iter },
        base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      try {
        const raw = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(u.iv) }, kek, b64(u.key));
        return { raw: new Uint8Array(raw), name: id };
      } catch (e) { return null; }
    }

    function attachEcountPanel() {
    'use strict';
    const office = 'http://192.168.50.159:8770/';
    const fmt = new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit'
    });
    const dateParts = Object.fromEntries(fmt.formatToParts(new Date()).map(({type, value}) => [type, value]));
    const today = [dateParts.year, dateParts.month, dateParts.day].join('-');
    const dialog = document.createElement('dialog');
    dialog.id = 'sg-pages-ecount';
    dialog.setAttribute('aria-labelledby', 'sg-pages-ecount-title');
    dialog.innerHTML = `
      <div class="sg-ec-heading">
        <h2 id="sg-pages-ecount-title">이카운트 자료 가져오기</h2>
        <button type="button" data-close aria-label="닫기">×</button>
      </div>
      <p>재고현황 1개와 재고변동표 12개를 회사 PC에서 받습니다.</p>
      <label class="sg-ec-date">기준일자<input type="date" required></label>
      <fieldset>
          <legend>회사 PC 프로그램 저장 위치</legend>
        <div class="sg-ec-options">
          <label><input type="radio" name="sg-storage" value="drive" checked> 구글 드라이브 <small>기본</small></label>
          <label><input type="radio" name="sg-storage" value="local"> 이 PC 폴더</label>
        </div>
        <div class="sg-ec-folder"><span data-path></span><button type="button" data-intent="folder">폴더 변경</button></div>
        <div data-google>
          <a href="https://accounts.google.com/AccountChooser?continue=https%3A%2F%2Fdrive.google.com%2Fdrive%2Fmy-drive" target="_blank" rel="noopener noreferrer">구글 드라이브 로그인 · 계정 변경</a>
          <p>저장 계정을 바꾸려면 회사 PC의 데스크톱용 Google Drive에 해당 계정을 추가하고, 그 계정의 동기화 폴더를 선택하세요.</p>
        </div>
          <a href="https://login.ecount.com/" target="_blank" rel="noopener noreferrer">이카운트 로그인 열기</a>
          <button type="button" class="sg-ec-primary" data-browser-download>이카운트 자동 다운로드</button>
          <div class="sg-ec-browser-tools">
            <a href="browser-bot/install.html" target="_blank" rel="noopener noreferrer">재고봇 설치 방법</a>
            <button type="button" data-browser-settings>브라우저 저장 폴더 설정</button>
          </div>
          <p data-browser-status role="status">같은 브라우저의 이카운트 ERP 탭에서 다운로드합니다.</p>
        <button type="button" class="sg-ec-saved" data-intent="saved">받아 둔 자료 불러오기</button>
          <button type="button" class="sg-ec-saved" data-manual>엑셀 파일 직접 선택</button>
          <input type="file" data-browser-files multiple accept=".xlsx,.xls" hidden>
          <button type="button" class="sg-ec-saved" data-intent="download">회사 PC 프로그램에서 다운로드</button>
          <p>웹에서 받은 엑셀은 브라우저 다운로드 폴더에 저장됩니다. 구글 드라이브에 저장하려면 그 계정의 동기화 폴더를 브라우저 다운로드 위치로 지정하세요.</p>
      </fieldset>
    `;
    const style = document.createElement('style');
    style.textContent = `
      #sg-pages-ecount { width:min(520px,calc(100% - 24px)); max-height:calc(100dvh - 24px); overflow:auto; margin:auto; padding:22px; background:#fff; color:#172439; border:1px solid #d9e2ec; border-radius:15px; box-shadow:0 18px 60px #13294044; font:14px system-ui,sans-serif; }
      #sg-pages-ecount::backdrop { background:#152137a0; }
      #sg-pages-ecount h2 { font-size:19px; font-weight:800; margin:0; }
      #sg-pages-ecount p { color:#52647b; font-size:12px; margin:8px 0 14px; line-height:1.5; }
      #sg-pages-ecount .sg-ec-heading, #sg-pages-ecount .sg-ec-folder { display:flex; justify-content:space-between; align-items:center; gap:8px; }
      #sg-pages-ecount .sg-ec-date { display:grid; gap:5px; max-width:190px; font-weight:700; }
      #sg-pages-ecount .sg-ec-date input, #sg-pages-ecount button { padding:7px 10px; border:1px solid #c6d9d1; border-radius:8px; background:white; color:#163b32; }
      #sg-pages-ecount button { font-size:12px; font-weight:750; cursor:pointer; }
      #sg-pages-ecount fieldset { margin:14px 0 0; padding:12px; border:1px solid #a7ddc6; border-radius:10px; background:#f0fbf6; }
      #sg-pages-ecount legend { padding:0 4px; color:#075a44; font-weight:800; }
      #sg-pages-ecount fieldset p { margin:8px 0 0; }
      #sg-pages-ecount .sg-ec-options { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
      #sg-pages-ecount .sg-ec-options label { padding:7px; border:1px solid #cadbd4; border-radius:8px; background:#fff; font-size:12px; }
      #sg-pages-ecount .sg-ec-options label:has(:checked) { border-color:#72ba9e; background:#e4f6ed; }
      #sg-pages-ecount input[type=radio] { accent-color:#007957; }
      #sg-pages-ecount .sg-ec-folder { margin-top:8px; }
      #sg-pages-ecount .sg-ec-folder span { font-size:12px; overflow-wrap:anywhere; }
      #sg-pages-ecount .sg-ec-folder button { flex:none; }
      #sg-pages-ecount [data-google] { margin-top:8px; }
      #sg-pages-ecount [data-google] a { color:#155aa8; font-size:12px; font-weight:750; text-decoration:underline; }
      #sg-pages-ecount [data-google] p { margin-top:4px; }
      #sg-pages-ecount .sg-ec-primary, #sg-pages-ecount .sg-ec-saved { display:block; width:100%; margin-top:7px; }
      #sg-pages-ecount .sg-ec-primary { color:#fff; background:#007957; border-color:#007957; }
      #sg-pages-ecount .sg-ec-browser-tools { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:7px; }
      #sg-pages-ecount a { color:#155aa8; font-size:12px; text-decoration:underline; }
      #sg-pages-ecount [data-browser-status] { white-space:pre-line; overflow-wrap:anywhere; color:#075a44; }
      #sg-pages-ecount button:disabled { opacity:.6; cursor:default; }
      #sg-pages-ecount button:focus-visible, #sg-pages-ecount input:focus-visible, #sg-pages-ecount-open:focus-visible { outline:3px solid #3b9c83; outline-offset:2px; }
      #sg-pages-ecount-open { padding:6px 10px; border-radius:8px; border:1px solid #008056; background:#007957; color:white; font-size:12px; font-weight:750; cursor:pointer; }
    `;
    document.head.append(style);
    document.body.append(dialog);
    const date = dialog.querySelector('input[type=date]');
    date.value = today;
    const mode = () => dialog.querySelector('input[name=sg-storage]:checked').value;
    const renderPath = () => {
      const drive = mode() === 'drive';
      dialog.querySelector('[data-google]').hidden = !drive;
      dialog.querySelector('[data-path]').textContent = drive
        ? ['구글 드라이브', '재고관리', '이카운트_다운로드', date.value.replaceAll('-', '')].filter(Boolean).join(' / ')
        : '회사 PC 작업 화면에서 저장 폴더 선택';
    };
    dialog.querySelector('fieldset').addEventListener('change', renderPath);
    date.addEventListener('change', renderPath);
    const browserStatus = dialog.querySelector('[data-browser-status]');
    const browserDownload = dialog.querySelector('[data-browser-download]');
    let browserPort;
    function browserRequest(type) {
      if (type === 'download' && !date.reportValidity()) return;
      const runtime = globalThis.chrome?.runtime;
      if (typeof runtime?.connect !== 'function') {
        browserStatus.textContent = 'Chrome 또는 Edge에서 재고봇 확장 프로그램을 설치해 주세요.';
        return;
      }
      browserStatus.textContent = '재고봇에 연결 중입니다.';
      if (type === 'download') browserDownload.disabled = true;
      try {
        browserPort?.disconnect();
        const port = runtime.connect('fhlhmhkelapncihoccmfcemfnehepogp', {name: 'sg-ecount-browser'});
        browserPort = port;
        let browserHeartbeat;
        const connectTimer = setTimeout(() => {
          browserStatus.textContent = '재고봇이 응답하지 않습니다. 확장 프로그램을 설치하고 사이트를 새로고침해 주세요.';
          browserDownload.disabled = false;
          port.disconnect();
        }, 5_000);
        port.onDisconnect.addListener(() => {
          const connectionError = runtime.lastError;
          clearInterval(browserHeartbeat);
          clearTimeout(connectTimer);
          if (browserPort !== port) return;
          browserPort = undefined;
          browserDownload.disabled = false;
          if (connectionError) browserStatus.textContent = '재고봇이 연결되지 않았습니다. 설치 후 사이트를 새로고침해 주세요.';
        });
        port.onMessage.addListener(message => {
          clearTimeout(connectTimer);
          if (message.type === 'ready' && type === 'download-settings') {
            browserStatus.textContent = '브라우저 설정에서 다운로드 위치를 지정하세요.';
            clearInterval(browserHeartbeat);
          }
          if (message.type === 'started' || message.type === 'progress') {
            const count = message.count ?? 0;
            browserStatus.textContent = count + ' / ' + message.total + '개 다운로드 중' + (message.name ? '\n' + message.name : '');
          }
          if (message.type === 'complete') {
            browserStatus.textContent = message.count + '개 다운로드 완료\n' + message.folder;
            browserDownload.disabled = false;
            clearInterval(browserHeartbeat);
          }
          if (message.type === 'error') {
            browserStatus.textContent = message.message;
            browserDownload.disabled = false;
            clearInterval(browserHeartbeat);
          }
        });
        port.postMessage({type: 'status'});
        port.postMessage({type, date: date.value});
        if (type === 'download') browserHeartbeat = setInterval(() => port.postMessage({type: 'status'}), 12_000);
      } catch {
        browserStatus.textContent = '재고봇을 설치한 후 페이지를 새로고침해 주세요.';
        browserDownload.disabled = false;
      }
    }
    browserDownload.addEventListener('click', () => browserRequest('download'));
    dialog.querySelector('[data-browser-settings]').addEventListener('click', () => {
      if (!browserDownload.disabled) browserRequest('download-settings');
    });
    const upload = dialog.querySelector('[data-browser-files]');
    dialog.querySelector('[data-manual]').addEventListener('click', () => {
      if (typeof window.handleEcountFile === 'function') upload.click();
      else window.open(office + '#ecount=manual&storage=' + mode() + '&date=' + encodeURIComponent(date.value), '_blank', 'noopener,noreferrer');
    });
    upload.addEventListener('change', async event => {
      if (!upload.files.length) return;
      const originalDate = document.getElementById('ecountBaseDate');
      if (originalDate) originalDate.value = date.value;
      const count = upload.files.length;
      try {
        await window.handleEcountFile(event);
        browserStatus.textContent = count + '개 파일을 선택했습니다. 재고 반영 결과는 화면에 표시됩니다.';
      } catch {
        browserStatus.textContent = '엑셀 파일을 읽지 못했습니다. 다운로드한 .xlsx 파일을 확인해 주세요.';
      } finally {
        upload.value = '';
      }
    });
    dialog.querySelector('[data-close]').addEventListener('click', () => dialog.close());
    for (const button of dialog.querySelectorAll('[data-intent]')) {
      button.addEventListener('click', () => {
        if (!date.reportValidity()) return;
        const target = new URL(office);
        target.hash = new URLSearchParams({
          ecount: button.dataset.intent, storage: mode(), date: date.value
        }).toString();
        window.open(target.href, '_blank', 'noopener,noreferrer');
      });
    }
    function openDialog() {
      if (dialog.open) return;
      renderPath();
      dialog.showModal();
    }
    window.openEcountModal = openDialog;
    const openButton = document.createElement('button');
    openButton.type = 'button';
    openButton.id = 'sg-pages-ecount-open';
    openButton.textContent = '이카운트 자료 가져오기';
    openButton.addEventListener('click', openDialog);
    const existing = document.getElementById('btnEcountOpen');
    if (existing && existing.parentElement.getClientRects().length) {
      existing.hidden = true;
      existing.after(openButton);
    } else {
      const header = document.querySelector('header');
      (header || document.body).prepend(openButton);
    }
    }

    async function openApp(rawKey) {
      const key = await crypto.subtle.importKey('raw', rawKey, 'AES-GCM', false, ['decrypt']);
      const r = await fetch('data/app.enc?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) throw new Error('재고 자료(data/app.enc)를 찾지 못했습니다.');
      const buf = new Uint8Array(await r.arrayBuffer());
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, key, buf.slice(12));
      const ds = new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'));
      const html = await new Response(ds).text();
      document.open(); document.write(html); document.close();
      try { attachEcountPanel(); } catch (error) { console.warn('이카운트 메뉴를 열 수 없습니다.', error); }
    }

    async function resume() {
      let k = null; try { k = sessionStorage.getItem('sg_pages_key'); } catch (e) {}
      if (!k) return false;
      try { setBusy(true, '여는 중…'); await openApp(b64(k)); return true; }
      catch (e) { try { sessionStorage.removeItem('sg_pages_key'); } catch (x) {} setBusy(false); return false; }
    }

    $('form').addEventListener('submit', async e => {
      e.preventDefault();
      if (busy) return;
      setErr('');
      const id = $('id').value.trim(), pw = $('password').value;
      if (!id || !pw) { setErr('아이디와 비밀번호를 입력해 주세요.'); return; }
      if (!window.crypto || !crypto.subtle || !window.DecompressionStream) { setErr('이 브라우저에서는 열 수 없습니다. 최신 크롬이나 엣지로 열어 주세요.'); return; }
      setBusy(true);
      try {
        const u = await unwrapKey(id, pw);
        if (!u) { setErr('아이디 또는 비밀번호가 맞지 않습니다.'); setBusy(false); $('password').select(); return; }
        try { sessionStorage.setItem('sg_pages_key', toB64(u.raw)); sessionStorage.setItem('sg_pages_user', u.name); } catch (x) {}
        setBusy(true, '여는 중…');
        await openApp(u.raw);
      } catch (err) {
        setErr(err.message || String(err)); setBusy(false);
      }
    });

    resume().then(ok => { if (!ok) $('id').focus(); });
  })();
  </script>
</body>
</html>
