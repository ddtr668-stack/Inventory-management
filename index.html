  (function () {
    // 재고 자료(data/app.enc)는 AES-GCM 으로 잠겨 있고, 아이디·비밀번호가 맞아야만 풀립니다.
    // 요청 시 로그인 정보는 브라우저의 비밀번호 관리자에만 전달합니다.
    const $ = id => document.getElementById(id);
    const enc = new TextEncoder();
    const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
    const toB64 = u => btoa(String.fromCharCode.apply(null, u));
    const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
    const deployedRevision = document.querySelector('meta[name="deployment-revision"]').content;
    const idleLimit = 10 * 60 * 1000;
    const activityKey = 'sg_pages_activity_at';
    const sessionKeys = ['sg_pages_key', 'sg_pages_user', 'sg_pages_readonly', activityKey];
    let busy = false;

    async function requestPasswordSave(id, password) {
      if (!window.PasswordCredential || !navigator.credentials?.store) return;
      try {
        await navigator.credentials.store(new window.PasswordCredential({id, password}));
      } catch {
        // 로그인은 브라우저의 저장 여부와 관계없이 계속 진행합니다.
      }
    }

    function lastActivityAt() {
      try { return Number(sessionStorage.getItem(activityKey)) || 0; }
      catch { return 0; }
    }

    function rememberActivity(timestamp) {
      try { sessionStorage.setItem(activityKey, String(timestamp)); } catch {}
    }

    function logout(inactive = false) {
      try {
        sessionKeys.forEach(key => sessionStorage.removeItem(key));
        if (inactive) sessionStorage.setItem('sg_pages_idle_notice', '1');
      } catch {}
      location.replace(location.pathname);
    }

    function watchSessionActivity() {
      let lastAt = lastActivityAt() || Date.now();
      let timer;
      let expired = false;
      const check = () => {
        clearTimeout(timer);
        if (expired) return false;
        const remaining = idleLimit - (Date.now() - lastAt);
        if (remaining <= 0) {
          expired = true;
          logout(true);
          return false;
        }
        timer = setTimeout(check, remaining);
        return true;
      };
      if (!check()) return;
      const track = event => {
        if (!event.isTrusted || expired) return;
        const now = Date.now();
        if (now - lastAt < 1000) return;
        if (now - lastAt >= idleLimit) {
          check();
          return;
        }
        lastAt = now;
        rememberActivity(lastAt);
        check();
      };
      for (const type of ['pointerdown', 'pointermove', 'touchstart', 'keydown', 'scroll', 'wheel']) {
        window.addEventListener(type, track, {capture: true, passive: true});
      }
      document.addEventListener('visibilitychange', check);
      window.addEventListener('pageshow', check);
    }

    function setErr(t) { $('error').textContent = t || ''; $('error').classList.toggle('hidden', !t); }

    async function getJson(url) {
      const r = await fetch(url + '?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) throw new Error('자료 파일을 찾지 못했습니다 (' + url + ')');
      return r.json();
    }

    async function unwrapKey(id, password) {
      const keys = await getJson('data/keys.json');
      const idHash = hex(await crypto.subtle.digest('SHA-256', enc.encode('sg-inv:' + id.trim().toLowerCase())));
      const u = (keys.users || {})[idHash];
      if (!u) return null;
      const base = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
      const kek = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(u.salt), iterations: u.iter },
        base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      try {
        const raw = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(u.iv) }, kek, b64(u.key));
        return { raw: new Uint8Array(raw), name: id };
      } catch (e) { return null; }
    }

    const date = dialog.querySelector('input[type=date]');

    const browserStatus = dialog.querySelector('[data-browser-status]');
    const browserDownload = dialog.querySelector('[data-browser-download]');
    let browserPort;
    function browserRequest(type) {
      if (type === 'download' && !date.reportValidity()) return;
      const runtime = globalThis.chrome?.runtime;
      if (typeof runtime?.connect !== 'function') {
        browserStatus.textContent = 'Chrome 또는 Edge에서 재고봇 확장 프로그램을 설치해 주세요.';
        return;
      }
      browserStatus.textContent = '재고봇에 연결 중입니다.';
      if (type === 'download') browserDownload.disabled = true;
      try {
        browserPort?.disconnect();
        const port = runtime.connect('fhlhmhkelapncihoccmfcemfnehepogp', {name: 'sg-ecount-browser'});
        browserPort = port;
        let browserHeartbeat;
        const connectTimer = setTimeout(() => {
          browserStatus.textContent = '재고봇이 응답하지 않습니다. 확장 프로그램을 설치하고 사이트를 새로고침해 주세요.';
          browserDownload.disabled = false;
          port.disconnect();
        }, 5_000);
        port.onDisconnect.addListener(() => {
          const connectionError = runtime.lastError;
          clearInterval(browserHeartbeat);
          clearTimeout(connectTimer);
          if (browserPort !== port) return;
          browserPort = undefined;
          browserDownload.disabled = false;
          if (connectionError) browserStatus.textContent = '재고봇이 연결되지 않았습니다. 설치 후 사이트를 새로고침해 주세요.';
        });
        port.onMessage.addListener(message => {
          clearTimeout(connectTimer);
          if (message.type === 'ready' && type === 'download-settings') {
            browserStatus.textContent = '브라우저 설정에서 다운로드 위치를 지정하세요.';
            clearInterval(browserHeartbeat);
          }
          if (message.type === 'started' || message.type === 'progress') {
            const count = message.count ?? 0;
            browserStatus.textContent = count + ' / ' + message.total + '개 다운로드 중' + (message.name ? '\n' + message.name : '');
          }
          if (message.type === 'complete') {
            browserStatus.textContent = message.count + '개 다운로드 완료\n' + message.folder;
            browserDownload.disabled = false;
            clearInterval(browserHeartbeat);
          }
          if (message.type === 'error') {
            browserStatus.textContent = message.message;
            browserDownload.disabled = false;
            clearInterval(browserHeartbeat);
          }
        });
        port.postMessage({type: 'status'});
        port.postMessage({type, date: date.value});
        if (type === 'download') browserHeartbeat = setInterval(() => port.postMessage({type: 'status'}), 12_000);
      } catch {
        browserStatus.textContent = '재고봇을 설치한 후 페이지를 새로고침해 주세요.';
        browserDownload.disabled = false;
      }
    }

          #ecBoardCards .ec-bc {flex:0 0 auto}
          #ecBoardCards :is(.ec-bc-q,.ec-bar) {display:none}
          #ecBoardBar {align-items:flex-start}
          #ecBoardBarSlots {flex:1 0 100%;justify-content:flex-start}
          #ecBoardBarSlots .relative {flex:1 0 100%}
          #dashboardBoardsContainer {min-width:0;max-width:100%;overflow:hidden}
          #dashboardBoardsContainer .sg-stock-scroll {overflow-x:auto;max-width:100%}
          #dashboardBoardsContainer table.matrix-table {width:max-content;min-width:100%;border-collapse:separate;border-spacing:0}
          #dashboardBoardsContainer .sg-mobile-res {display:table-cell;color:#ffc96f;text-align:center;background:#2a241c;padding:3px 5px}
          #dashboardBoardsContainer .sg-total, #dashboardBoardsContainer .print-board-sheet > div:not(.print-sign-box) > div > span.sg-summary {display:none!important}
          #dashboardBoardsContainer .sg-fixed {position:sticky;left:var(--sg-left);width:var(--sg-width);min-width:var(--sg-width);max-width:var(--sg-width);white-space:normal;overflow-wrap:anywhere;background:#14243a!important;color:#f1f5f9!important;z-index:2}
          #sg-model-content {grid-auto-columns:100%;scroll-snap-type:x mandatory}
          #sg-model-content section {scroll-snap-align:start;overflow:auto}
          #sg-model-content table {min-width:290px}
        }
        @media screen {
          .sg-mobile-inventory #dashboardBoardsContainer, .sg-mobile-inventory .print-board-sheet {min-width:0;max-width:100%}
          .sg-mobile-inventory .sg-stock-scroll {overflow-x:auto;max-width:100%}
          .sg-mobile-inventory #dashboardBoardsContainer table.matrix-table {width:max-content;min-width:0}
          .sg-mobile-inventory #dashboardBoardsContainer .sg-stock-scroll:not(.sg-table-expanded) .sg-fixed {position:static}
        }
        @media print {
          #sg-compare-actions,.sg-model-check,#sg-model-dialog {display:none!important}
          #dashboardBoardsContainer table.matrix-table {zoom:1!important}
        }
      `;
      document.head.append(style);

      const actions = document.createElement('div');
      actions.id = 'sg-compare-actions';
      actions.className = 'no-print';
      actions.innerHTML = '<span role="status">0개 선택</span><button type="button" disabled>재고 보기</button><button type="button" disabled>설치 사양 보기</button>';
      board.before(actions);
      const zoomButton = document.createElement('button');
      zoomButton.type = 'button';
      zoomButton.textContent = '표 확대';
      zoomButton.setAttribute('aria-pressed', 'false');
      const [count, stockButton, specButton] = actions.children;
      let expanded = false;

      function fitBoardTables() {
        if (!mobile) return;
        const boardWidth = board.clientWidth;
        if (!boardWidth) return;
        for (const table of board.querySelectorAll('table.matrix-table')) {
          const frame = table.parentElement;
          frame.classList.toggle('sg-table-expanded', expanded);
          table.style.zoom = '1';
          if (expanded) continue;
          const width = Math.min(boardWidth, frame.clientWidth);
          const naturalWidth = table.getBoundingClientRect().width;
          if (width > 0 && naturalWidth > width) table.style.zoom = String((width - 1) / naturalWidth);
          frame.scrollLeft = 0;
        }
      }

      if (mobile) {
        actions.append(zoomButton);
        zoomButton.addEventListener('click', () => {
          expanded = !expanded;
          zoomButton.textContent = expanded ? '한 화면 맞춤' : '표 확대';
          zoomButton.setAttribute('aria-pressed', String(expanded));
          fitBoardTables();
        });
        let lastWidth = 0;
        new ResizeObserver(([entry]) => {
          const width = entry.contentRect.width;
          if (width === lastWidth) return;
          lastWidth = width;
          fitBoardTables();
        }).observe(board);
        document.fonts?.ready.then(fitBoardTables);
      }

      const dialog = document.createElement('dialog');
      dialog.id = 'sg-model-dialog';
      dialog.setAttribute('aria-labelledby', 'sg-model-title');
      dialog.innerHTML = '<h2 id="sg-model-title"></h2><div id="sg-model-actions"><button type="button">재고 보기</button><button type="button">설치 사양 보기</button></div><div id="sg-model-content" tabindex="0" aria-label="선택 모델 비교"></div><form method="dialog"><button>닫기</button></form>';
      document.body.append(dialog);
      const content = dialog.querySelector('#sg-model-content');
      let displayed = [];
      const viewport = window.visualViewport;

      function fitModelDialog() {
        if (!viewport || !viewport.width || !viewport.height) return;
        const scale = viewport.scale || 1;
        dialog.classList.add('sg-visual-fit');
        dialog.style.setProperty('--sg-dialog-x', viewport.offsetLeft + viewport.width / 2 + 'px');
        dialog.style.setProperty('--sg-dialog-y', viewport.offsetTop + viewport.height / 2 + 'px');
        dialog.style.setProperty('--sg-dialog-width', Math.min(1180, viewport.width * scale - 16) + 'px');
        dialog.style.setProperty('--sg-dialog-height', viewport.height * scale - 16 + 'px');
        dialog.style.setProperty('--sg-dialog-scale', String(1 / scale));
      }

      function updateOpenDialog() {
        if (dialog.open) fitModelDialog();
      }

      viewport?.addEventListener('resize', updateOpenDialog);
      viewport?.addEventListener('scroll', updateOpenDialog);

      function components(entry) {
        const current = inventoryItem(entry.code);
        if (entry.board !== 'pac_cac') {
          return [{ label: current?.unit_type || '품목', code: entry.code }];
        }
        const row = BOARDS_MATRIX[entry.board]?.[entry.row];
        const codeAt = key => {
          const code = row?.[key]?.m;
          return code && !code.startsWith('*') ? code : '';
        };
        const indoors = [codeAt('c1'), codeAt('c3')].filter(Boolean);
        const indoor = indoors.includes(entry.code) ? entry.code : (indoors.length === 1 ? indoors[0] : '');
        return [
          {label:'실내기', code:indoor},
          {label:'실외기', code:codeAt('c2')},
          {label:'배관', code:codeAt('c4')}
        ];
      }

      function stockTable(parts) {
        const groups = warehouses.map(([label]) => `<th scope="colgroup" colspan="2">${label}</th>`).join('');
        const columns = warehouses.map(() => '<th scope="col">현재고</th><th scope="col">예약</th>').join('');
        const rows = parts.map(({label, code}) => {
          const item = inventoryItem(code);
          const quantity = key => Number.isFinite(item?.[key]) ? item[key].toLocaleString('ko-KR') : '—';
          const cells = warehouses.map(([,key]) =>
            `<td>${quantity(key + '_qty')}</td><td class="sg-res">${quantity(key + '_res')}</td>`).join('');
          return `<tr><th scope="row">${safe(label)}</th><td class="sg-model-code">${safe(code || '미등록')}</td>${cells}</tr>`;
        }).join('');
        return `<table><thead><tr><th rowspan="2" scope="col">구성품</th><th rowspan="2" scope="col">모델명</th>${groups}</tr><tr>${columns}</tr></thead><tbody>${rows}</tbody></table>`;
      }

      function specs(entry, parts) {
        const outdoor = parts.find(part => part.label === '실외기')?.code;
        const model = inventoryItem(outdoor || entry.code);
        const data = model?.installation_specs || {};
        return `<dl>${specFields.map(([label,key]) =>
          `<div><dt>${label}</dt><dd>${safe(data[key] || '미등록')}</dd></div>`).join('')}</dl>`;
      }

      function show(entries, mode) {
        if (!entries.length) return;
        displayed = entries;
        const stock = mode === 'stock';
        dialog.querySelector('h2').textContent = stock ? '선택 모델 재고' : '선택 모델 설치 사양';
        [...dialog.querySelector('#sg-model-actions').children].forEach((button, index) =>
          button.setAttribute('aria-pressed', String(stock === (index === 0))));
        content.innerHTML = entries.map(entry => {
          const parts = components(entry);
          return `<section><h3>${safe(entry.code)}</h3>${stock ? stockTable(parts) : specs(entry, parts)}</section>`;
        }).join('');
        content.scrollLeft = 0;
        fitModelDialog();
        if (!dialog.open) dialog.showModal();
        dialog.scrollTop = 0;
      }

      stockButton.onclick = () => show([...selected.values()], 'stock');
      specButton.onclick = () => show([...selected.values()], 'spec');
      dialog.querySelector('#sg-model-actions').children[0].onclick = () => show(displayed, 'stock');
      dialog.querySelector('#sg-model-actions').children[1].onclick = () => show(displayed, 'spec');

      function enhanceBoard() {
        const tables = board.querySelectorAll('table.matrix-table:not([data-sg-enhanced])');
        tables.forEach(table => {
          table.dataset.sgEnhanced = 'true';
          table.parentElement.classList.add('sg-stock-scroll');
          const header = [...(table.tHead?.rows[0]?.cells || [])];
          const totals = header.map(cell => cell.textContent.trim() === '합계');
          const schColumns = header.map(cell => cell.textContent.trim() === '순천향');
          header.forEach((cell, index) => cell.classList.toggle('sg-total', totals[index]));
          const frozen = ['품목','평형','구분'].every((label,index) => header[index]?.textContent.trim() === label);
          const pin = (cell, index) => {
            if (!frozen || index > 2) return;
            cell.classList.add('sg-fixed');
            cell.style.setProperty('--sg-left', [0, 70, 106][index] + 'px');
            cell.style.setProperty('--sg-width', [70, 36, 56][index] + 'px');
          };
          const insertReservation = (cell, value) => {
            const extra = document.createElement(cell.tagName.toLowerCase());
            extra.className = 'sg-mobile-res';
            extra.textContent = value;
            extra.title = '순천향 예약';
            cell.after(extra);
          };
          header.forEach((cell, index) => {
            pin(cell, index);
            if (schColumns[index]) insertReservation(cell, '예약');
          });
          table.closest('.print-board-sheet')?.querySelectorAll(':scope > div > div > span:has(strong)').forEach(span => span.classList.add('sg-summary'));
          for (const body of table.tBodies) for (const row of body.rows) {
            const rowId = row.querySelector('[data-rid]')?.dataset.rid || '';
            const [boardId, rowIndex] = rowId.split(':');
            let column = 0;
            let currentModel = null;
            for (const cell of [...row.cells]) {
              const start = column;
              column += cell.colSpan;
              if (cell.colSpan === 1) {
                pin(cell, start);
                cell.classList.toggle('sg-total', totals[start] === true);
              }
              const model = cell.querySelector('span.font-mono');
              const ownModel = cell.classList.contains('font-mono') && cell.matches('[onclick^="openEditModal"]');
              const code = model?.textContent.trim() || (ownModel ? cell.firstChild?.textContent.trim() : '');
              if (header[start]?.className.includes('bg-slate-200/70') || code) currentModel = code ? inventoryItem(code) : null;
              if (cell.colSpan === 1 && schColumns[start]) {
                insertReservation(cell, Number.isFinite(currentModel?.sch_res) ? currentModel.sch_res.toLocaleString('ko-KR') : '—');
              }
              if (!code) continue;
              const entry = {code, board:boardId, row:rowIndex};
              const key = JSON.stringify([rowId,code]);
              const check = document.createElement('input');
              check.type = 'checkbox';
              check.className = 'sg-model-check';
              check.checked = selected.has(key);
              check.dataset.sgKey = key;
              check.setAttribute('aria-label', code + ' 선택');
              check.onclick = event => event.stopPropagation();
              check.onchange = () => {
                if (check.checked) selected.set(key, entry); else selected.delete(key);
                count.textContent = selected.size + '개 선택';
                stockButton.disabled = specButton.disabled = !selected.size;
                board.querySelectorAll('.sg-model-check').forEach(input => {
                  if (input.dataset.sgKey === key) input.checked = check.checked;
                });
              };
              const link = document.createElement('button');
              link.type = 'button';
              link.className = 'sg-model-link';
              link.textContent = code;
              link.onclick = event => { event.stopPropagation(); show([entry], 'stock'); };
              cell.removeAttribute('title');
              if (model) model.replaceWith(check, link);
              else cell.firstChild.replaceWith(check, link);
            }
          }
        });
        if (tables.length) fitBoardTables();
      }

      new MutationObserver(enhanceBoard).observe(board, {childList:true, subtree:true});
      enhanceBoard();
    }

    function isMobileInventory() {
      return navigator.userAgentData?.mobile === true ||
        /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) ||
        window.matchMedia('(max-width: 767px), (pointer: coarse) and (max-device-width: 1024px)').matches;
    }

    function attachSessionControls() {
      const banners = [...document.body.querySelectorAll('div, aside, header, p, section')];
      const banner = banners.reverse().find(element => {
        const text = element.textContent.trim();
        return text.startsWith('조회 전용 페이지입니다') && text.length < 250 &&
          text.includes('이카운트에서 받기는 동작하지 않습니다') && text.includes('로그아웃');
      });
      banner?.remove();

      const brand = document.querySelector('#ecSidebar .ec-sb-logo');
      if (!brand) return;
      const controls = document.createElement('span');
      controls.style.cssText = 'display:inline-flex;align-items:center;gap:6px;white-space:nowrap;margin-inline-start:auto';
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = '로그아웃';
      button.style.cssText = 'padding:4px 8px;border:1px solid currentColor;border-radius:5px;font-size:12px';
      button.addEventListener('click', () => logout());
      controls.append(button);
      if (/^[a-f0-9]{40}$/i.test(deployedRevision)) {
        const version = document.createElement('code');
        version.textContent = 'v.' + deployedRevision.slice(0, 7);
        version.title = '배포 버전 ' + deployedRevision;
        version.style.cssText = 'font-size:11px;color:inherit';
        controls.append(version);
      }
      brand.append(controls);
    }

    async function openApp(rawKey, accountName, readOnly) {
      const mobile = isMobileInventory();
      const adminMode = !readOnly && !mobile && accountName?.trim().toLowerCase() === 'admin';
      const key = await crypto.subtle.importKey('raw', rawKey, 'AES-GCM', false, ['decrypt']);
      const r = await fetch('data/app.enc?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) throw new Error('재고 자료(data/app.enc)를 찾지 못했습니다.');
      const buf = new Uint8Array(await r.arrayBuffer());
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, key, buf.slice(12));
      const ds = new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'));
      const html = await new Response(ds).text();
      document.open();
      document.write(html);
      document.addEventListener('DOMContentLoaded', () => {
        watchSessionActivity();
        attachSessionControls();
        try {
          if (mobile) {
            const viewport = document.querySelector('meta[name="viewport"]') || document.createElement('meta');
            viewport.name = 'viewport';
            viewport.content = 'width=device-width, initial-scale=1';
            if (!viewport.isConnected) document.head.append(viewport);
          }
          attachInventoryComparison(adminMode, mobile);
        } catch (error) {
          console.warn('재고 비교를 준비할 수 없습니다.', error);
        }
        if (!adminMode) {
          const style = document.createElement('style');
          style.textContent = `
            #ecPageHead, #ecKpi, #ecOldKpi, #ecOldWhBar, .ec-sb-it, .ec-sb-sec, .ec-sb-ft,
            [id^="navTab-"], #btnBoardEdit, .ec-seg,
            [onclick^="openEcountModal"], [onclick^="openUsersModal"],
            [onclick^="resetBoardEdits"], [onclick^="toggleBoardEditMode"],
            [onclick^="syncToGoogleDrive"], [onclick^="openDriveConfigModal"],
            [onclick^="openAddModal"], [onclick^="quickAdjustStock"], [onclick^="exportDashboardExcel"],
            label:has(#chkIncludeNewOnBoards) {display:none!important}
          `;
          document.head.append(style);
          window.openEditModal = () => {};
          return;
        }
        try { attachEcountPanel(); } catch (error) { console.warn('이카운트 메뉴를 열 수 없습니다.', error); }
      }, {once: true});
      document.close();
    }

    async function resume() {
      let k = null; try { k = sessionStorage.getItem('sg_pages_key'); } catch (e) {}
      if (!k) return false;
      const lastAt = lastActivityAt();
      if (lastAt && Date.now() - lastAt >= idleLimit) {
        logout(true);
        return true;
      }
      if (!lastAt) rememberActivity(Date.now());
      try { setBusy(true, '여는 중…'); await openApp(b64(k), sessionStorage.getItem('sg_pages_user'), sessionStorage.getItem('sg_pages_readonly') === '1'); return true; }
      catch (e) { try { sessionStorage.removeItem('sg_pages_key'); } catch (x) {} setBusy(false); return false; }
    }

    $('form').addEventListener('submit', async e => {
      e.preventDefault();
      if (busy) return;
      const readOnly = e.submitter?.id === 'readOnly';
      const saveCredentials = $('rememberCredentials').checked;
      setErr('');
      const id = $('id').value.trim(), pw = $('password').value;
      if (!id || !pw) {
        setErr(readOnly ? '읽기 전용 조회에 사용할 아이디와 비밀번호를 입력해 주세요.' : '아이디와 비밀번호를 입력해 주세요.');
        $(id ? 'password' : 'id').focus();
        return;
      }
      if (!window.crypto || !crypto.subtle || !window.DecompressionStream) { setErr('이 브라우저에서는 열 수 없습니다. 최신 크롬이나 엣지로 열어 주세요.'); return; }
      setBusy(true);
      try {
        const u = await unwrapKey(id, pw);
        if (!u) { setErr('아이디 또는 비밀번호가 맞지 않습니다.'); setBusy(false); $('password').select(); return; }
        if (saveCredentials) await requestPasswordSave(u.name, pw);
        rememberActivity(Date.now());
        try { sessionStorage.setItem('sg_pages_key', toB64(u.raw)); sessionStorage.setItem('sg_pages_user', u.name); sessionStorage.setItem('sg_pages_readonly', readOnly ? '1' : '0'); } catch (x) {}
        setBusy(true, '여는 중…');
        await openApp(u.raw, u.name, readOnly);
      } catch (err) {
        setErr(err.message || String(err)); setBusy(false);
      }
    });

    try {
      if (sessionStorage.getItem('sg_pages_idle_notice') === '1') {
        sessionStorage.removeItem('sg_pages_idle_notice');
        $('loginNotice').textContent = '10분 동안 활동이 없어 자동 로그아웃되었습니다.';
        $('loginNotice').classList.remove('hidden');
      }
    } catch {}
    if (!window.PasswordCredential || !navigator.credentials?.store) {
      $('rememberCredentials').disabled = true;
      $('rememberHint').classList.remove('hidden');
    }
    resume().then(ok => { if (!ok) $('id').focus(); });
  })();
  </script>
</body>
</html>
